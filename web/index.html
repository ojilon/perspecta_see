<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>perspecta_see — see how the project fits together</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/graph.css">
  <link rel="stylesheet" href="css/cards.css">
</head>
<body>

  <!-- An inline script on purpose: the scanner parses <script> bodies
       (src/parse_html.c), so this function shows up inside index.html's card
       and proves the html -> js bridge works both ways. -->
  <script>
    /* the project you looked at last time, read before the map loads */
    function lastRoot() {
      try { return localStorage.getItem("perspecta.root") || ""; } catch (err) { return ""; }
    }
  </script>

  <header id="topbar">
    <div id="brand"><span class="mark"></span>perspecta_see</div>

    <div class="field">
      <label for="root">project</label>
      <input id="root" type="text" spellcheck="false" autocomplete="off"
             placeholder="/home/me/project  or  D:/projects/thing">
    </div>
    <button id="scan" class="primary">Scan</button>

    <div class="field search">
      <input id="search" type="search" spellcheck="false" autocomplete="off"
             placeholder="filter files / functions   ( / )">
    </div>

    <div id="status">starting…</div>
    <div class="spacer"></div>

    <div class="segmented" id="modes" title="which links to draw on the map">
      <button id="mode-files" data-mode="files" class="on">Files</button>
      <button id="mode-calls" data-mode="calls">Calls</button>
    </div>

    <div id="zoombox">
      <button id="zoom-out" title="zoom out  (-)">−</button>
      <span id="zoomlabel">100%</span>
      <button id="zoom-in" title="zoom in  (+)">+</button>
      <button id="fit" title="fit everything  (f)">Fit</button>
      <button id="tidy" title="forget dragged positions  (t)">Tidy</button>
    </div>
  </header>

  <main>
    <aside id="tree">
      <div id="tree-head">FILES</div>
      <div id="tree-body"></div>
    </aside>

    <section id="canvas">
      <div id="world">
        <svg id="lines"></svg>
        <div id="cards"></div>
      </div>
      <div id="hud" class="float"></div>
      <div id="legend" class="float"></div>
    </section>
  </main>

  <script src="js/util.js"></script>
  <script src="js/api.js"></script>
  <script src="js/state.js"></script>
  <script src="js/tree.js"></script>
  <script src="js/cards.js"></script>
  <script src="js/inline-editor.js"></script>
  <script src="js/edges.js"></script>
  <script src="js/view.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
